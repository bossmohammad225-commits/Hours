name: Build Hours APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Hours_v1.2.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -type f -name gradlew -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find gradlew in the ZIP."
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hours-APK
          path: "**/build/outputs/apk/**/*.apk"
